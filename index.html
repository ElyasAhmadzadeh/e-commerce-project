<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./bootstrap-5.0.2-dist/css/bootstrap.css"><!--bootstrap 4.5 css-->
    <link rel="stylesheet" href="./fontawesome-free-7.1.0-web/css/all.css"><!--font awesome css-->
    <link rel="stylesheet" href="style.css"><!--local styles-->

    <title>E-Commerce</title>
</head>

<body>
    <header class="header">
        <div class="container-fluid">
            <section class="top-header row justify-content-between align-items-center p-1 p-lg-2">
                <div class="phone-number-header col-12 col-sm-4 col-md-6">
                    <span class="phone-number-icon px-1"><i class="fa fa-phone"></i></span> <span
                        class="phone-number">+98 912 7733445</span>
                </div>
                <div class="date-time-header d-flex col-12 col-sm-8 col-md-6">
                    <div class="date">
                        <span class="date-icon"><i class="fa fa-calendar-alt px-1"></i></span>
                        <span class="date-display">10 / 04 / 2026</span>
                    </div>
                    <div class="time">
                        <span class="time-icon px-2"><i class="fa fa-clock"></i></span><span class="time-display">22 :
                            30 : 01</span>
                    </div>
                </div>
            </section>
            <section class="primary-header row py-3 px-2">
                <div class="logo-container col-10 col-sm-2"></div>
                <nav class="navbar-container px-1">
                    <div class="search-category-container">search</div>
                    <div class="lang-cart-container">cart</div>
                </nav>
                <button type="button" class="header-nav-btn d-inline-block d-sm-none col-2"></button>
            </section>
        </div>
    </header>





</body>

<!-- <script src="./modules/jquery-3.5.1.min.js"></script>
<script src="./modules/popper.min.js"></script> -->

<script src="script.js" type="module"></script><!--local scripts-->
<script src="./bootstrap-5.0.2-dist/js/bootstrap.bundle.js"></script><!--bootstrap js scripts-->
<script src="./fontawesome-free-7.1.0-web/js/all.js"></script><!--font awesome js-->

</html>
