<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.css"><!--bootstrap 5 css-->
    <link rel="stylesheet" href="../vendor/bootstrap-icons/font/bootstrap-icons.css"><!--bootstrap 5 icons-->
    <link rel="stylesheet" href="../fontawesome-free-7.1.0-web/css/all.css">
    <link rel="stylesheet" href="../style.css"><!--local styles-->


    <title>Products</title>
</head>

<body>

    <header class="header">
        <div class="container-fluid">
            <section class="top-header row justify-content-between align-items-center py-1 px-0 p-lg-2">
                <div class="phone-number-header col-12 col-sm-4 col-md-5">
                    <span class="phone-number-icon px-1"><i class="fa fa-phone" aria-hidden="true"></i></span> <span
                        class="phone-number"><a href="tel:+989127733445">+98 912 7733445</a></span>
                </div>
                <div class="contact-header-box col-12 col-sm-8 col-md-7">
                    <a href="#" class="text-white contact-us"> <i class="fa fa-address-book pe-2"></i><span>Contact
                            Us</span></a>
                    <span class="email-address text-white"><span class="pe-2"><i
                                class="fa fa-envelope"></i></span><span><a
                                href="mailto:myecomerce@gmail.com">myecomerce@gmail.com</a></span></span>
                </div>
            </section>
            <section class="primary-header row py-2 px-0">
                <div class="overlay-box">
                    <div class="overlay"></div>
                </div>
                <div class="logo-container col-10 col-sm-10 col-md-3">
                    <a href="#"> <img src="../assests/commerce-business-and-finance-svgrepo-com.svg"
                            class="logo-img img-thumbnail" alt="site logo"></a>
                    <div class="logo-text">
                        <h6>Technology Shop</h6>
                        <span>Shop Smart, Live Better</span>
                    </div>
                </div>
                <nav class="navbar-container col-md-9 px-1">
                    <div class="search-category-container">
                        <form action="#" class="header-search-form">
                            <div class="input-group">
                                <input type="search" class="header-search-input ps-2"
                                    placeholder="what are you looking for?" name="" id="headerSearchInput">
                                <button class="search-btn" type="submit" id="header-search-btn"><i
                                        class="fa fa-search"></i></button>
                            </div>
                            <section class="search-suggestion p-2">
                                <ul class="search-suggestion-list list-unstyled p-1">
                                </ul>
                            </section>
                        </form>
                        <div class="category-selection py-2 py-md-0">
                            <button type="button" class="dropdown-category-btn dropdown-toggle"
                                id="headerCategoryDropDownBtn" data-bs-toggle="dropdown">Categories</button>
                            <ul class="dropdown-menu mt-1 mt-md-2" aria-labelledby="headerCategoryDropDownBtn">
                                <li><a href="#" class="dropdown-item">Smartphones</a></li>
                                <li><a href="#" class="dropdown-item">Laptops</a></li>
                                <li><a href="#" class="dropdown-item">Tablets</a></li>
                                <li><a href="#" class="dropdown-item">Mobile Accessories</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="lang-cart-container">
                        <button type="button" class="dropdown-lang-btn dropdown-toggle" id="headerLangDropDownBtn"
                            data-bs-toggle="dropdown">Language</button>
                        <ul class="dropdown-menu mt-1 mt-md-2" aria-labelledby="headerLangDropDownBtn">
                            <li><a href="#" class="dropdown-item"><img
                                        src="../assests/flag-for-flag-united-kingdom-svgrepo-com.svg"
                                        class="flag-icon pe-2" alt=""><span>English</span></a></li>
                            <li><a href="#" class="dropdown-item"><img
                                        src="../assests/flag-for-flag-iran-svgrepo-com.svg" class="flag-icon pe-2"
                                        alt=""><span>Farsi</span></a></li>
                        </ul>
                        <a href="#" class="cart-btn text-center"><i class="fa fa-cart-shopping"></i><span
                                class="ps-1">Cart</span></a>
                    </div>
                </nav>
                <button type="button" class="header-nav-btn d-inline-block d-md-none col-1 me-3">
                    <i class="fa fa-bars"></i>
                </button>
            </section>
        </div>
    </header>
    <main class="products-main container-fluid">
        <nav class="row breadcrump-container py-3" aria-label="breadcrumb">
            <ol class="col-12 m-0 ps-5 breadcrumb-list list-unstyled">
                <li class="breadcrumb-item"><a href="../index.html" class="breadcrumb-link">Home</a></li>
                <li class="breadcrumb-item"><a href="#" class="breadcrumb-link current-page">Products</a></li>
            </ol>
        </nav>

        <section class="row products-main-container py-5">
            <div class="col-12 toolbar p-3">
                <div class="product-count"><span class="products-number pe-2"></span>products</div>
                <div class="sort-selection-container">
                    <form action="#" class="sort-selection-form">

                    </form>
                </div>
                <button class="filters-btn">Filters</button>
            </div>
        </section>


    </main>


</body>
<script src="../script.js" type="module"></script><!--local scripts-->
<script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.js"></script>
<script src="../fontawesome-free-7.1.0-web/js/all.js"></script>

</html>
